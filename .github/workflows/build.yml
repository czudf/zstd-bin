name: Build zstd binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to PyPI'
        required: false
        default: false
        type: boolean

jobs:
  build-linux:
    name: Build for Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    container:
      image: quay.io/pypa/manylinux_2_28_${{ matrix.arch }}:2026.06.12-2
    strategy:
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x86_64
          - runner: ubuntu-22.04-arm
            arch: aarch64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.2.0

      - name: Build wheel (compiles zstd from source)
        run: uv build --wheel

      - name: Test wheel
        run: |
          uv venv .venv
          uv pip install --no-index -f dist/ zstd-bin
          .venv/bin/zstd --version
          .venv/bin/zstd --help | head -5
          sha256sum .venv/bin/zstd

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v7
        with:
          name: wheel-linux-${{ matrix.arch }}
          path: dist/*.whl

  build-macos:
    name: Build for macOS
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.2.0

      - name: Build wheel (compiles zstd from source)
        run: uv build --wheel

      - name: Test wheel
        run: |
          uv venv .venv
          uv pip install --no-index -f dist/ zstd-bin
          .venv/bin/zstd --version
          .venv/bin/zstd --help | head -5
          shasum -a 256 .venv/bin/zstd

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v7
        with:
          name: wheel-macos-aarch64
          path: dist/*.whl

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-22.04
    needs: [build-linux, build-macos]
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    permissions:
      contents: write
      id-token: write  # For PyPI trusted publishing
      attestations: write
      artifact-metadata: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Prepare wheel distribution
        run: |
          mkdir -p dist
          cp artifacts/wheel-*/*.whl dist/
          ls -lh dist/

      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-path: dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
